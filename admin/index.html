<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Yönetici Paneli | Sanal Akademi</title><style>
:root{--orange:#dd722b}*{box-sizing:border-box}body{margin:0;background:#fffaf5;color:#111;font:16px Inter,Arial,sans-serif}header{background:#111;color:white;padding:23px 6%;display:flex;justify-content:space-between;align-items:center;gap:15px}header strong{font-size:20px}header a{color:white;text-decoration:none}main{max-width:950px;margin:35px auto;padding:0 18px}h1{font-size:30px;margin:0 0 10px}p{line-height:1.5}.panel{background:white;border:1px solid #eee;border-radius:15px;padding:25px;margin:20px 0;box-shadow:0 7px 30px #00000009}label{display:flex;flex-direction:column;gap:7px;font-weight:700;margin:12px 0}input,select,textarea{font:inherit;padding:12px;border:1px solid #ccc;border-radius:8px;width:100%}textarea{min-height:120px}button{font:inherit;cursor:pointer;border:1px solid #ddd;border-radius:9px;padding:11px 16px;background:white}button.primary{background:var(--orange);color:white;border-color:var(--orange);font-weight:700}button:disabled{opacity:.6;cursor:wait}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:190px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.notice{border:1px solid #eee;border-radius:12px;padding:18px;margin:12px 0;background:#fff}.notice h3{margin:7px 0}.notice p{white-space:pre-wrap}.muted{color:#666;font-size:14px}.status{min-height:24px;color:#92400e} [hidden]{display:none!important}</style></head><body><header><strong>🦉 Sanal Akademi • Yönetim</strong><a href="/">← Web Sitesine Dön</a></header><main><h1>Duyuru Yönetimi</h1><p class="muted">Bu alan yalnızca Supabase'de yetkilendirilmiş kulüp yöneticileri içindir.</p><div class="panel" id="login-panel"><h2>Yönetici Girişi</h2><form id="login-form"><label>E-posta<input id="email" type="email" autocomplete="username" required></label><label>Şifre<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Giriş Yap</button></form></div><div id="workspace" hidden><div class="panel"><div class="actions" style="justify-content:space-between;align-items:center"><h2>Duyuru Ekle / Düzenle</h2><button id="logout" type="button">Çıkış Yap</button></div><form id="notice-form"><label>Başlık<input id="title" maxlength="90" required></label><label>Açıklama<textarea id="body" maxlength="1500" required></textarea></label><div class="row"><label>Kategori<select id="category"><option>Genel</option><option>Toplantı</option><option>Etkinlik</option></select></label><label>Öne çıkar<select id="pin"><option value="false">Hayır</option><option value="true">Evet</option></select></label><label>Yayın durumu<select id="published"><option value="true">Hemen yayımla</option><option value="false">Taslak olarak kaydet</option></select></label></div><div class="actions"><button class="primary" type="submit" id="save">Duyuruyu Kaydet</button><button type="button" id="cancel" hidden>Düzenlemeyi İptal Et</button></div></form></div><div class="panel"><h2>Mevcut Duyurular</h2><div id="notices"></div></div></div><p id="status" class="status" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(()=>{
const status=document.getElementById('status'),loginPanel=document.getElementById('login-panel'),workspace=document.getElementById('workspace'),form=document.getElementById('notice-form'),notices=document.getElementById('notices');
if(!window.supabase){status.textContent='Bağlantı kütüphanesi yüklenemedi. İnternet bağlantını kontrol et.';return;}
const db=window.supabase.createClient('https://clcwjvypwyjejpqjjktl.supabase.co','sb_publishable_DLbTxlyMshuCZ_QSXeyjvQ_f81qmmFM');
let authorized=false,editId=null;
const say=s=>status.textContent=s;
const val=id=>document.getElementById(id).value;
function reset(){editId=null;form.reset();document.getElementById('cancel').hidden=true;document.getElementById('save').textContent='Duyuruyu Kaydet';}
async function refresh(){const {data,error}=await db.from('duyurular').select('id,baslik,aciklama,kategori,onemli,yayinlandi,olusturulma_tarihi').order('olusturulma_tarihi',{ascending:false});if(error){say('Duyurular yüklenemedi: '+error.message);return;}notices.replaceChildren();if(!data.length){notices.textContent='Henüz duyuru yok.';return;}for(const n of data){const card=document.createElement('article');card.className='notice';const meta=document.createElement('div');meta.className='muted';meta.textContent=n.kategori+' • '+new Date(n.olusturulma_tarihi).toLocaleDateString('tr-TR')+(n.yayinlandi?' • Yayında':' • Taslak')+(n.onemli?' • Öne çıkan':'');const h=document.createElement('h3');h.textContent=n.baslik;const p=document.createElement('p');p.textContent=n.aciklama;const buttons=document.createElement('div');buttons.className='actions';const edit=document.createElement('button');edit.textContent='Düzenle';edit.onclick=()=>{editId=n.id;document.getElementById('title').value=n.baslik;document.getElementById('body').value=n.aciklama;document.getElementById('category').value=n.kategori;document.getElementById('pin').value=String(n.onemli);document.getElementById('published').value=String(n.yayinlandi);document.getElementById('cancel').hidden=false;document.getElementById('save').textContent='Değişiklikleri Kaydet';form.scrollIntoView({behavior:'smooth'});};const del=document.createElement('button');del.textContent='Sil';del.onclick=async()=>{if(!confirm('Bu duyuruyu kalıcı olarak silmek istiyor musun?'))return;const {error}=await db.from('duyurular').delete().eq('id',n.id);if(error)say('Silinemedi: '+error.message);else{say('Duyuru silindi.');await refresh();}};buttons.append(edit,del);card.append(meta,h,p,buttons);notices.append(card);}}
async function check(){const {data}=await db.auth.getUser();const user=data?.user;authorized=false;if(user){const r=await db.from('yoneticiler').select('rol').eq('kullanici_id',user.id).maybeSingle();authorized=!!r.data&&!r.error;}loginPanel.hidden=authorized;workspace.hidden=!authorized;if(authorized){say('Yönetici olarak giriş yaptın.');await refresh();}else if(user){say('Bu hesabın yönetici yetkisi yok.');}else{say('');}}
document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();say('Giriş yapılıyor…');const {error}=await db.auth.signInWithPassword({email:val('email').trim(),password:val('password')});document.getElementById('password').value='';if(error)say('Giriş başarısız: '+error.message);else await check();});
document.getElementById('logout').onclick=async()=>{await db.auth.signOut();reset();await check();};
document.getElementById('cancel').onclick=reset;
form.addEventListener('submit',async e=>{e.preventDefault();if(!authorized)return;const payload={baslik:val('title').trim(),aciklama:val('body').trim(),kategori:val('category'),onemli:val('pin')==='true',yayinlandi:val('published')==='true'};if(!payload.baslik||!payload.aciklama)return;const button=document.getElementById('save');button.disabled=true;const q=editId?db.from('duyurular').update(payload).eq('id',editId):db.from('duyurular').insert(payload);const {error}=await q;button.disabled=false;if(error){say('Kaydedilemedi: '+error.message);return;}reset();say('Duyuru kaydedildi.');await refresh();});
check();
})();
</script></body></html>
